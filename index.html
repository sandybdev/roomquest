<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROOM QUEST</title>
<style>body{margin:0;background:#121b26;color:#eef2f7;font:14px system-ui}header{padding:14px 20px;background:#1c2938;display:flex;gap:12px;align-items:center}button,select,input{background:#26394d;color:white;border:1px solid #53677b;border-radius:7px;padding:8px}button{cursor:pointer}button:hover{background:#34516d}.app{display:grid;grid-template-columns:270px 1fr 270px;height:calc(100vh - 64px)}aside{padding:18px;background:#1b2736;overflow:auto}main{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}h2{margin-top:0}label{display:block;margin:13px 0 6px}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #344354;padding:9px 0}.status{white-space:pre-line;line-height:1.8}.hint{position:absolute;bottom:16px;left:16px;background:#172433dd;padding:12px;border-radius:9px}input{width:90px}button.active{background:#166e80}@media(max-width:850px){.app{grid-template-columns:190px 1fr}aside:last-child{grid-column:1/-1}.app{height:auto}main{height:65vh}}</style></head>
<body><header><strong>ROOM QUEST</strong><button id="author" class="active">문제 출제</button><button id="solve">문제 풀이</button><span id="mode"></span></header>
<div class="app"><aside><h2 id="leftTitle">문제 출제</h2><label>방 가로(m) <input id="rw" type="number" min="2" max="12" step=".5" value="5"></label><label>방 세로(m) <input id="rd" type="number" min="2" max="12" step=".5" value="4"></label><button id="resize">방 크기 적용</button><h3>가구 추가</h3><div id="catalog"></div><p>가구를 클릭해 선택한 뒤 방향키로 이동, R로 회전, Delete로 삭제할 수 있어요.</p></aside>
<main id="stage"><div class="hint">마우스 드래그: 카메라 회전 · 휠: 확대/축소 · 가구 클릭: 선택</div></main>
<aside><h2>조건 및 판정</h2><div id="rules"></div><p><button id="save">문제 저장</button> <button id="check">통과 검사</button></p><div class="status" id="status"></div><h3>선택한 가구</h3><div id="selected">없음</div><p>데모: 브라우저에 로컬 저장됩니다. 공유/랭킹은 아직 미구현입니다.</p></aside></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
const defs=[{id:'bed',name:'침대',w:2,d:1.5,h:.55,color:0xd8d0bf},{id:'desk',name:'책상',w:1.3,d:.65,h:.75,color:0x9b7655,power:false},{id:'wardrobe',name:'옷장',w:1.2,d:.6,h:2,color:0xc7b69b,open:.65},{id:'lamp',name:'스탠드',w:.35,d:.35,h:1.4,color:0xe9c66b,power:true,cord:2},{id:'fridge',name:'냉장고',w:.65,d:.7,h:1.6,color:0xdce3e7,power:true,cord:1.5},{id:'sofa',name:'소파',w:1.6,d:.8,h:.8,color:0x688a81}];
let mode='author', room={w:5,d:4}, furniture=[],required=['bed','desk','wardrobe'],selected=null,serial=0;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17202a);const camera=new THREE.PerspectiveCamera(45,1,.1,100);camera.position.set(7,7,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.querySelector('#stage').prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x657184,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(3,9,5);sun.castShadow=true;scene.add(sun);
let world=new THREE.Group();scene.add(world);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let meshes=[];
function box(w,h,d,color,x,y,z,parent=world){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.8}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function draw(){world.clear();meshes=[];box(room.w,.12,room.d,0xd6c2a6,0,-.08,0);box(room.w,2.7,.12,0xe9e5de,0,1.35,-room.d/2);box(.12,2.7,room.d,0xf1eee8,-room.w/2,1.35,0);box(.12,2.7,room.d,0xf1eee8,room.w/2,1.35,0);
box(.8,.02,.08,0xffffff,room.w/2-.8,.03,-room.d/2+.1);
furniture.forEach(f=>{const def=defs.find(d=>d.id===f.type);const g=new THREE.Group();g.position.set(f.x,0,f.z);g.rotation.y=f.rot*Math.PI/2;world.add(g);const m=box(def.w,def.h,def.d,def.color,0,def.h/2,0,g);m.userData.fid=f.uid;meshes.push(m);if(f.uid===selected){const edge=new THREE.BoxHelper(m,0x12e5e2);g.add(edge)}if(def.open){const a=box(def.w,.012,def.open,0x47d4ad,0,.012,def.d/2+def.open/2,g);a.material.transparent=true;a.material.opacity=.35}})}
function add(type){const f={uid:++serial,type,x:0,z:0,rot:0};furniture.push(f);selected=f.uid;draw();show()}
function footprint(f){const d=defs.find(v=>v.id===f.type);return f.rot%2?{w:d.d,d:d.w}:{w:d.w,d:d.d}}
function collides(a,b){const p=footprint(a),q=footprint(b);return Math.abs(a.x-b.x)<(p.w+q.w)/2-.001&&Math.abs(a.z-b.z)<(p.d+q.d)/2-.001}
function valid(f){const p=footprint(f);return Math.abs(f.x)+p.w/2<=room.w/2&&Math.abs(f.z)+p.d/2<=room.d/2&&!furniture.some(v=>v.uid!==f.uid&&collides(f,v))}
function check(){const issues=[];for(const id of required){if(!furniture.some(f=>f.type===id))issues.push('필수 가구 누락: '+defs.find(d=>d.id===id).name)}for(const f of furniture){const def=defs.find(d=>d.id===f.type);if(!valid(f))issues.push(def.name+' 배치 충돌/범위 초과');if(def.power){const outlet={x:room.w/2-.8,z:-room.d/2+.1};const dist=Math.hypot(f.x-outlet.x,f.z-outlet.z);if(dist>def.cord)issues.push(def.name+' 전원 케이블 부족 ('+dist.toFixed(1)+'m / '+def.cord+'m)')}if(def.open){const clearance={...f,z:f.z+Math.cos(f.rot*Math.PI/2)*(def.d/2+def.open/2),x:f.x+Math.sin(f.rot*Math.PI/2)*(def.d/2+def.open/2)};if(!valid(clearance))issues.push(def.name+' 개폐 공간 확인 필요')}}document.querySelector('#status').textContent=issues.length?'❌ 미통과\n'+issues.join('\n'):'✅ 기본 통과 조건 충족';return issues.length===0}
function show(){document.querySelector('#selected').textContent=furniture.find(f=>f.uid===selected)?.type||'없음';document.querySelector('#mode').textContent=mode==='author'?'출제 모드':'풀이 모드';document.querySelector('#rules').innerHTML=required.map(id=>'<label><input type="checkbox" data-req="'+id+'" '+(required.includes(id)?'checked':'')+' '+(mode==='solve'?'disabled':'')+'> '+defs.find(d=>d.id===id).name+' 필수</label>').join('');document.querySelectorAll('[data-req]').forEach(el=>el.onchange=()=>{required=Array.from(document.querySelectorAll('[data-req]:checked')).map(v=>v.dataset.req)})}
document.querySelector('#catalog').innerHTML=defs.map(d=>'<div class="item">'+d.name+' <button data-add="'+d.id+'">추가</button></div>').join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
document.querySelector('#resize').onclick=()=>{if(mode!=='author')return;room={w:+document.querySelector('#rw').value,d:+document.querySelector('#rd').value};draw()};
document.querySelector('#save').onclick=()=>{if(mode!=='author')return;localStorage.setItem('roomquest-problem',JSON.stringify({room,required}));document.querySelector('#status').textContent='문제 저장 완료. 문제 풀이 탭으로 이동하세요.'};
document.querySelector('#author').onclick=()=>switchMode('author');document.querySelector('#solve').onclick=()=>switchMode('solve');
function switchMode(m){mode=m;document.querySelector('#author').classList.toggle('active',m==='author');document.querySelector('#solve').classList.toggle('active',m==='solve');if(m==='solve'){const p=JSON.parse(localStorage.getItem('roomquest-problem')||'null');if(p){room=p.room;required=p.required}furniture=[];selected=null}document.querySelector('#rw').disabled=document.querySelector('#rd').disabled=document.querySelector('#resize').disabled=m==='solve';document.querySelector('#save').disabled=m==='solve';draw();show()}
document.querySelector('#check').onclick=check;
renderer.domElement.addEventListener('pointerdown',e=>{const rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(meshes);if(hits.length){selected=hits[0].object.userData.fid;draw();show()}});
window.addEventListener('keydown',e=>{const f=furniture.find(v=>v.uid===selected);if(!f||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const old={...f};if(e.key==='ArrowLeft')f.x-=.1;if(e.key==='ArrowRight')f.x+=.1;if(e.key==='ArrowUp')f.z-=.1;if(e.key==='ArrowDown')f.z+=.1;if(e.key.toLowerCase()==='r')f.rot=(f.rot+1)%4;if(e.key==='Delete'||e.key==='Backspace'){furniture=furniture.filter(v=>v.uid!==f.uid);selected=null}if(furniture.includes(f)&&!valid(f))Object.assign(f,old);draw();show();if(e.key.startsWith('Arrow'))e.preventDefault()});
function resize(){const e=document.querySelector('#stage');renderer.setSize(e.clientWidth,e.clientHeight);camera.aspect=e.clientWidth/e.clientHeight;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();draw();show();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
